version: '3.8'

services:
  # -----------------------------------------------------------------
  # Service 1: Gluetun VPN Client 🚀
  # -----------------------------------------------------------------
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: mirror-cockpit-vpn
    pull_policy: always
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${WEBUI_PORT:-8094}:8000"
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - OPENVPN_PROTOCOL=tcp
      - OPENVPN_CUSTOM_PORT=443
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
    healthcheck:
      test: ["CMD-SHELL", "ip a | grep -q tun0 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  # -----------------------------------------------------------------
  # Service 2: The Website Mirror Cockpit 🖥️
  # -----------------------------------------------------------------
  mirror-cockpit:
    build:
      context: .
    image: website-mirror-cockpit:latest
    # --- FIX: Prevents Portainer from trying to pull the local image ---
    pull_policy: never
    container_name: mirror-cockpit-app
    restart: unless-stopped
    command: ["/usr/local/bin/uvicorn", "app.server:app", "--host", "0.0.0.0", "--port", "8000"]
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - mirror_data:/data/output
      - app_state:/data

# -----------------------------------------------------------------
# Define the volumes used by the services
# -----------------------------------------------------------------
volumes:
  mirror_data:
  app_state:
