version: '3.8'

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: mirror-cockpit-vpn
    pull_policy: always
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${WEBUI_PORT:-8094}:8001"
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - OPENVPN_PROTOCOL=tcp
      - OPENVPN_CUSTOM_PORT=443
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
    healthcheck:
      test: ["CMD-SHELL", "ip a | grep -q tun0 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  mirror-cockpit:
    build:
      context: .
    image: website-mirror-cockpit:latest
    pull_policy: never
    container_name: mirror-cockpit-app
    restart: unless-stopped
    command:
      - /usr/local/bin/gunicorn
      - -w
      - "2"
      - -k
      - uvicorn.workers.UvicornWorker
      - app.server:app
      - --bind
      - 0.0.0.0:8001
      - --log-level
      - info
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - mirror_data:/data/output
      - app_state:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  mirror_data:
  app_state:
